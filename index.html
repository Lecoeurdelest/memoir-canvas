<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Memoir Canvas — an evidence-first family memory canvas</title>
    <meta
      name="description"
      content="A family memory archive that refuses to let an AI turn a guess into a fact. Postgres in the browser, no server, no account."
    />
    <!-- The forest owns the first viewport, so the browser's own chrome should be the night sky
         rather than a white band above it. Matches #071319 in app.css. -->
    <meta name="theme-color" content="#071319" />
    <!-- A firefly, inline as a data URI: no request, and it satisfies `img-src 'self' data:`
         without widening the CSP that enforces NFR-PRIV-01. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071319'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e8d46a' opacity='.18'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23e8d46a' opacity='.45'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fffce8'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
